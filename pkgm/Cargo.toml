[package]
name = "pkgm"
version = "0.1.0"
edition = "2021"
description = "包链显微镜: Git pack/index/loose object forensics"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
flate2 = "1.1"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[[bin]]
name = "pkgm"
path = "src/main.rs"
sha2 = "0.10"
