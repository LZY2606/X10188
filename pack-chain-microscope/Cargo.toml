[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1.0"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-listener = "0.3"
