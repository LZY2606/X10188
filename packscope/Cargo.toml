[package]
name = "packscope"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "packscope"
path = "src/main.rs"

[lib]
name = "packscope"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1.0", features = ["rust_backend"] }
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
