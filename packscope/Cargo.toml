[package]
name = "packscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta chain forensics"

[[bin]]
name = "packscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"
hex = "0.4"
sha1 = "0.10"
anyhow = "1"
thiserror = "1"
tower-http = { version = "0.6", features = ["fs"] }
