[package]
name = "packscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "packscope"
path = "src/lib.rs"

[[bin]]
name = "packscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
miniz_oxide = "0.8"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
