[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜：Git pack / index / loose object 取证明细分析"

[lib]
name = "packchain_microscope"
path = "src/lib.rs"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1"
