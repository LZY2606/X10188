[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "pcm"
path = "src/lib.rs"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 0
