[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1.1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1.1"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[profile.dev]
opt-level = 1
