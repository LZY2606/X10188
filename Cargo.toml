[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "Git pack/index/loose-object chain microscope"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
