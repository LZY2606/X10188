[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜: Git pack/index/loose object 取证分析器"

[lib]
name = "packchain"
path = "src/lib.rs"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
flate2 = "1"
sha1 = "0.10"
