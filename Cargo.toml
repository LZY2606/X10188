[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "Git pack/index/loose object chain microscope"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha1 = "0.10"
hex = "0.4"
tower = "0.5"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart"] }
