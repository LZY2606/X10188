[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜：Git pack / index / loose object 取证分析器"

[lib]
name = "microscope"
path = "src/lib.rs"

[[bin]]
name = "microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sha2 = "0.10"
