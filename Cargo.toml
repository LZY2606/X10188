[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1.0"
sha1 = "0.10"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"
