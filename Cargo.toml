[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "pack_chain_microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
