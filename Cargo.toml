[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = "1"
sha1 = "0.10"
crc32fast = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[profile.dev]
opt-level = 0
