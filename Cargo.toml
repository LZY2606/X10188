[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜：Git pack / index / loose object 取证分析"

[lib]
name = "packchain"
path = "src/lib.rs"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
flate2 = "1.0"
crc32fast = "1.4"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
