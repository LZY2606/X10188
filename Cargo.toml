[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1.1"
sha1 = "0.10"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[profile.dev]
opt-level = 1
