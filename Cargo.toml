[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "packchain microscope - Git pack/delta chain forensic analyzer"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
crc32fast = "1"

