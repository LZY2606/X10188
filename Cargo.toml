[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜：Git pack / idx / loose object 的 delta 链取證工具"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[lib]
name = "pack_chain_microscope"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
miniz_oxide = "0.7"
crc32fast = "1.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
