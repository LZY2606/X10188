[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
