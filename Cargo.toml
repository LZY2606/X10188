[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 — Git pack/index/loose object forensic analyzer (no git CLI)"

[lib]
name = "packchain"
path = "src/lib.rs"

[[bin]]
name = "packchain"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.0"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"

[profile.dev]
opt-level = 0
