[package]
name = "packscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta 取证分析"

[lib]
name = "packscope"
path = "src/lib.rs"

[[bin]]
name = "packscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = { version = "1.0", default-features = false, features = ["miniz_oxide"] }
miniz_oxide = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.test]
opt-level = 1
