[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta 取证分析工具"

[dependencies]
anyhow = "1"
axum = "0.7"
crc32fast = "1"
flate2 = "1"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
