[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack / index / loose object delta-chain forensic analyzer"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
tower = "0.5"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
