[package]
name = "pack_chain_microscope"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
crc32fast = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
