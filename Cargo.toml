[package]
name = "packscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta chain forensic analyzer"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
