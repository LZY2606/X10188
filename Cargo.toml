[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "packchain_microscope"
path = "src/lib.rs"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
crc32fast = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"

[dev-dependencies]
tempfile = "3"
