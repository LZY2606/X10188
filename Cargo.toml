[package]
name = "pack-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "pack_microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1.1"
miniz_oxide = "0.8"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1.5"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.test]
opt-level = 1
