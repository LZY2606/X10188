[package]
name = "packscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜: Git pack / index / loose object 取证分析"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
