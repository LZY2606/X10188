[package]
name = "pack-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜：Git pack / index / loose object 取证分析器"

[lib]
name = "pack_microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1.1"
sha1 = "0.10"
crc32fast = "1.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
