[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
crc32fast = "1"
hex = "0.4"
