[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜: Git pack/index/loose object 取证分析"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
sha1_smol = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
