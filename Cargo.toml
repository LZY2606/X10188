[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "Pack-chain microscope: forensic Git pack/index/loose object analyzer"

[lib]
name = "pcm"
path = "src/lib.rs"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
flate2 = "1.0"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
