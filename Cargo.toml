[package]
name = "packmic"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
crc32fast = "1.4"
flate2 = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
opt-level = 0
