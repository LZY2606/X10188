[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜: Git pack / index / loose object 取证与 delta 链还原"

[lib]
name = "packchain"
path = "src/lib.rs"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
crc32fast = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
