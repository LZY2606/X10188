[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta chain forensic analyzer"

[dependencies]
axum = { version = "0.8", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
