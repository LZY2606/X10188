[package]
name = "packscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "packscope"
path = "src/lib.rs"

[[bin]]
name = "packscope"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1"
