[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta 取证分析工具"

[lib]
name = "microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
