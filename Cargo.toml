[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "pcm"
path = "src/lib.rs"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
crc32fast = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { features = ["fs"], version = "0.6" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
