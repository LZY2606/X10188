[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 — Git pack/delta 取证分析工具"

[lib]
name = "pack_chain_microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.40", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
