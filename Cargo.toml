[package]
name = "packchain"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta 取证分析"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
