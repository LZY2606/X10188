[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "pack_chain_microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.5", features = ["multipart"] }
flate2 = "1.0.30"
hex = "0.4.3"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha1 = "0.10.6"
sha2 = "0.10.8"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
flate2 = "1.0.30"
tempfile = "3.10.1"
