[package]
name = "packscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 — Git pack/delta 取证分析"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"

[dev-dependencies]
rand = "0.8"
