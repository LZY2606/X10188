[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜：Git pack/index/loose object 解析与 delta 链取证"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[lib]
name = "packchain_microscope"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1.0"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
