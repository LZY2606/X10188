[package]
name = "pack-microscope"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pack-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = "1"
sha1 = "0.10"
crc32fast = "1"

[profile.dev]
opt-level = 0
