[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜 - Git pack/delta 取证分析器"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
debug = true
