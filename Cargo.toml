[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "packchain-microscope"
path = "src/main.rs"

[lib]
name = "packchain_microscope"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.35", features = ["bundled"] }
flate2 = "1.1"
sha1 = "0.10"
crc32fast = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
