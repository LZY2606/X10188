[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"

[lib]
name = "pack_chain_microscope"
path = "src/lib.rs"

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
