[package]
name = "pack-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜: Git pack / index / loose object forensics"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

[profile.dev]
opt-level = 1

[[bin]]
name = "pack-microscope"
path = "src/main.rs"
