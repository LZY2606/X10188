[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "microscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
flate2 = "1.1"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
