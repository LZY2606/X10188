[package]
name = "pack-chain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜：从零实现的 Git pack/delta 链取证分析器（Axum + SQLite）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
sha1 = "0.10"
crc32fast = "1.5"
tempfile = "3"
tower = "0.5"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0

[[bin]]
name = "pack-chain-microscope"
path = "src/main.rs"
