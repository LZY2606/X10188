[package]
name = "packchain-microscope"
version = "0.1.0"
edition = "2021"
description = "包链显微镜: inspect Git packs, indexes, loose objects and delta chains from scratch"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"

[profile.dev]
opt-level = 1
